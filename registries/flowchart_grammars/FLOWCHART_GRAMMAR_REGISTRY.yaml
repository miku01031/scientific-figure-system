grammars:
- name: CONTROL_BLOCK_DIAGRAM
  use_when: reference/control/plant feedback with named signals
  avoid_when: when this topology does not match the declared scientific relationships
  reading_direction: explicit layout supplied by semantic spec
  recommended_primitives:
  - waveform
  - matrix
  - small_graph
  default_size_mm: 145
  common_failure_modes:
  - unlabeled interfaces
  - unresolved label/edge collision
  - missing intermediate artifact
  status: RC_NATIVE_BACKEND_CANDIDATE
  layout_policy: No topology invention; explicit node positions/ports required
